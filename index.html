<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOAE Smart Service - แดชบอร์ดจัดการแร่ธาตุและคู่มือการปลูกพืชเศรษฐกิจ</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // ตั้งค่าสีเฉพาะกลุ่ม brand เพื่อให้แถบสีเขียวและโทนสีของแอปพลิเคชันแสดงผลได้ถูกต้อง 100%
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
              950: '#052e16',
            }
          }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // ตรวจสอบทันทีที่โหลดหน้าเว็บทั้งหมดเรียบร้อย
    window.addEventListener('DOMContentLoaded', function() {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;
      // ตรวจสอบว่าเปิดผ่าน LINE Browser
      if (userAgent.indexOf("Line") > -1) {
        var alertDiv = document.createElement("div");
        alertDiv.innerHTML = `
          <div style="position:fixed; top:0; left:0; width:100%; padding:15px; background:#ff4757; color:white; text-align:center; z-index:99999; font-weight:bold; font-size:14px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-family: 'Sarabun', sans-serif;">
            ⚠️ กำลังใช้งานผ่าน LINE อาจกดปุ่มบางฟังก์ชันไม่ได้! <br> 
            แนะนำ: กดจุด 3 จุดมุมขวาบน แล้วเลือก "เปิดในเบราว์เซอร์" (Open in Browser)
          </div>
        `;
        document.body.prepend(alertDiv);
        // เลื่อนเนื้อหาลงมาเล็กน้อยเพื่อไม่ให้โดนแถบเตือนบังหัวเว็บ
        document.body.style.paddingTop = "55px";
      }
    });
  </script>

  <style>
    body {
      font-family: 'Sarabun', sans-serif;
    }
    .font-kanit {
      font-family: 'Kanit', sans-serif;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: white !important;
        color: black !important;
        padding-top: 0px !important;
      }
      .print-full {
        width: 100% !important;
        max-width: 100% !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <header class="bg-brand-900 text-white shadow-md no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-brand-600 text-white p-2.5 rounded-xl shadow-inner flex items-center justify-center">
          <i class="fa-solid fa-wheat-awn text-2xl animate-pulse"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold font-kanit tracking-wide flex items-center gap-2">
            DOAE Smart Service <span class="bg-amber-500 text-brand-950 text-xs px-2 py-0.5 rounded-full font-sans font-bold">v2.0 - Pro</span>
          </h1>
          <p class="text-brand-200 text-xs font-light">วิเคราะห์ธาตุอาหารดินเชิงลึก N P K pH และระบบวางแผนพืชเศรษฐกิจรายแปลงแบบจับมือทำ</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="window.print()" class="bg-white/10 hover:bg-white/20 transition-all text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
          <i class="fa-solid fa-print"></i> พิมพ์คู่มือ
        </button>
        <span class="text-xs text-brand-200 hidden md:inline-block bg-brand-800 px-3 py-1.5 rounded-lg">
          <i class="fa-solid fa-microchip mr-1"></i> AI ปฐพีวิเคราะห์
        </span>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <section class="lg:col-span-5 flex flex-col gap-6 no-print">
      
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 flex flex-col gap-4">
        <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
          <i class="fa-solid fa-map-location-dot text-brand-600 text-lg"></i>
          <h2 class="text-lg font-semibold font-kanit text-slate-800">1. ข้อมูลแปลงและพืชเป้าหมาย</h2>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1" for="plotName">
            ชื่อแปลง / เกษตรกรผู้ปลูก
          </label>
          <div class="relative rounded-lg shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-id-card text-xs"></i>
            </div>
            <input type="text" id="plotName" placeholder="เช่น สวนทุเรียนลุงสมหมาย" 
              class="block w-full pl-9 pr-3 py-3 sm:py-2 border border-slate-200 rounded-lg text-sm focus:ring-brand-500 focus:border-brand-500 font-medium">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1" for="cropSelect">
            พืชเศรษฐกิจหลักที่ต้องการปลูก
          </label>
          <select id="cropSelect" onchange="handleInputsUpdate()"
            class="block w-full px-3 py-3 sm:py-2 border border-slate-200 rounded-lg text-base sm:text-sm font-semibold text-slate-800 bg-white focus:ring-brand-500 focus:border-brand-500">
          </select>
        </div>

        <div>
